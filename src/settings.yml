---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.2
serverless_language: node
refresh_interval_floor: ''
polling_url: https://raw.githubusercontent.com/michaelkurath/TRMNL-lifeclock/main/data/countries/{{ country_code }}.json
polling_headers: ''

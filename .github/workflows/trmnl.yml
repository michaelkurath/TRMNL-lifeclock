name: TRMNLP QA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".trmnlp.yml"
      - ".github/workflows/trmnl.yml"
  pull_request:
    paths:
      - "src/**"
      - ".trmnlp.yml"
      - ".github/workflows/trmnl.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - run: trmnlp lint

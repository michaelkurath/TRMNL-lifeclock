name: TRMNLP QA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "scripts/**"
      - "test/**"
      - ".trmnlp.yml"
      - ".github/workflows/trmnl.yml"
  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - "scripts/**"
      - "test/**"
      - ".trmnlp.yml"
      - ".github/workflows/trmnl.yml"
  workflow_dispatch:

jobs:
  trmnlp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate WPP runtime data
        run: python3 scripts/validate_data.py
      - name: Test serverless calculation
        run: node test/transform.test.js
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - name: Install PNG renderer dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - run: trmnlp lint
      - name: Render OG and TRMNL X with device classes
        run: python3 scripts/trmnlp_qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: trmnlp-renders
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 30

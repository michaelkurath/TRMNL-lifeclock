name: TRMNLP QA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - ".trmnlp.yml"
      - ".github/workflows/trmnl.yml"
  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - ".trmnlp.yml"
      - ".github/workflows/trmnl.yml"
  workflow_dispatch:

jobs:
  trmnlp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - name: Install PNG renderer dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - run: trmnlp lint
      - name: Render OG PNGs
        run: |
          trmnlp build --png --width 800 --height 480 --color-depth 1
          mv _build _build-og
      - name: Render TRMNL X PNGs
        run: |
          trmnlp build --png --width 1872 --height 1404 --color-depth 1
          mv _build _build-x
      - uses: actions/upload-artifact@v4
        with:
          name: trmnlp-renders
          path: |
            _build-og
            _build-x
          if-no-files-found: error

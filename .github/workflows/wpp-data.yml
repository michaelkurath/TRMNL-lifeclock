name: Build official UN WPP data

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_wpp_life_expectancy.py"
      - "scripts/validate_data.py"
      - "test/transform.test.js"
      - ".github/workflows/wpp-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build from official UN WPP 2024 bulk files
        run: python3 scripts/build_wpp_life_expectancy.py 2026
      - name: Validate generated dataset
        run: |
          python3 scripts/validate_data.py
          node test/transform.test.js
          git diff --check
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - name: Lint generated TRMNL settings
        run: trmnlp lint
      - name: Commit generated WPP data
        run: |
          git config user.name "life-clock-data[bot]"
          git config user.email "life-clock-data[bot]@users.noreply.github.com"
          git add data/countries data/manifest.json src/settings.yml
          if git diff --cached --quiet; then
            echo "Official WPP data already current."
          else
            git commit -m "Build official UN WPP 2026 life tables"
            git push
          fi
